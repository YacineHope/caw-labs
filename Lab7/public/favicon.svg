<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Kanban logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background rounded square -->
  <rect width="112" height="112" x="8" y="8" rx="20" fill="url(#g)" filter="url(#s)"/>

  <!-- three column slabs -->
  <g transform="translate(24,28)">
    <!-- column 1 -->
    <rect x="0" y="0" width="22" height="62" rx="4" fill="#083344" fill-opacity="0.08"/>
    <rect x="2" y="4" width="18" height="12" rx="3" fill="#ffffff"/>
    <rect x="2" y="20" width="18" height="10" rx="3" fill="#ffffff"/>

    <!-- column 2 -->
    <g transform="translate(30,0)">
      <rect x="0" y="0" width="22" height="62" rx="4" fill="#083344" fill-opacity="0.06"/>
      <rect x="2" y="6" width="18" height="14" rx="3" fill="#ffffff"/>
      <rect x="2" y="26" width="18" height="10" rx="3" fill="#ffffff"/>
    </g>

    <!-- column 3 -->
    <g transform="translate(60,0)">
      <rect x="0" y="0" width="22" height="62" rx="4" fill="#083344" fill-opacity="0.04"/>
      <rect x="2" y="8" width="18" height="12" rx="3" fill="#ffffff"/>
      <rect x="2" y="26" width="18" height="10" rx="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- subtle K monogram on top-right -->
  <g transform="translate(72,18)">
    <path d="M6 6 L6 42 L12 42 L12 26 L22 42 L30 42 L18 24 L30 6 L22 6 L14 18 L12 16 L12 6 Z" fill="rgba(255,255,255,0.92)"/>
  </g>

</svg>
